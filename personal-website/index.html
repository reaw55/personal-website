<!DOCTYPE html>
<html
  lang="en"
  class="scrollbar-thin scrollbar-track-zinc-800 scrollbar-thumb-zinc-500"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reaw's Portfolio</title>

      rel="icon"
      href="/images/logo/fav-icon/logo-v1-bg.svg"
      type="image/svg+xml"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols Rounded, subset to only the icons the site uses.

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_downward,arrow_outward,chevron_right,close,download,menu&display=block"
